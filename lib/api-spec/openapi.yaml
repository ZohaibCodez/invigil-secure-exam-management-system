openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: Examora secure examination platform
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Current authenticated user or null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
  /dashboard:
    get:
      operationId: getDashboard
      responses:
        "200":
          description: Role-scoped overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
  /exams:
    get:
      operationId: listExams
      responses:
        "200":
          description: Authorized examinations
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Exam" } }
    post:
      operationId: createExam
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExamInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exam" }
  /exams/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getExam
      responses:
        "200":
          description: Exam details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExamDetail" }
    patch:
      operationId: updateExam
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExamInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exam" }
    delete:
      operationId: deleteExam
      responses:
        "200":
          description: Deleted draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /exams/{id}/blueprint:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getBlueprintReport
      responses:
        "200":
          description: Staff-only quota validation and frozen form comparisons
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlueprintReport" }
    put:
      operationId: setBlueprint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlueprintInput" }
      responses:
        "200":
          description: Saved draft blueprint, including any explicit shortages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlueprintReport" }
  /exams/{id}/action:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: examAction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExamActionInput" }
      responses:
        "200":
          description: Updated examination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exam" }
  /exams/{id}/enrollments:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: enrollCandidates
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentInput" }
      responses:
        "200":
          description: Enrolled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /exams/{id}/start:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: startAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttemptInput" }
      responses:
        "200":
          description: Existing or new attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attempt" }
  /exams/{id}/entry-information:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getEntryInformation
      responses:
        "200":
          description: Authorized candidate entry information without question contents or credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntryInformation" }
  /exams/{id}/admissions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: listAdmissions
      responses:
        "200":
          description: Recent requests visible only to the owning examiner or an administrator
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Admission" } }
    post:
      operationId: requestAdmission
      responses:
        "200":
          description: New or existing unexpired request; never starts an exam timer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Admission" }
  /admissions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getAdmission
      responses:
        "200":
          description: Candidate-owned or authorized examiner view of an admission request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Admission" }
  /admissions/{id}/decision:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: decideAdmission
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdmissionDecisionInput" }
      responses:
        "200":
          description: Auditable authorized decision; possessing a QR does not authorize this action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Admission" }
  /attempts/{id}/commit-question:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: commitQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionCommitInput" }
      responses:
        "200":
          description: Server-confirmed immutable answer in an opt-in save-and-lock examination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attempt" }
  /exams/{id}/monitor:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getMonitor
      responses:
        "200":
          description: Live attempt progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
  /exams/{id}/announcements:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: createAnnouncement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementInput" }
      responses:
        "201":
          description: Announcement sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Announcement" }
  /questions:
    get:
      operationId: listQuestions
      responses:
        "200":
          description: Reusable question bank
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Question" } }
    post:
      operationId: createQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
  /questions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionInput" }
      responses:
        "200":
          description: Updated bank question without changing existing exams
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
    delete:
      operationId: deleteQuestion
      responses:
        "200":
          description: Removed from bank
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /users:
    get:
      operationId: listUsers
      responses:
        "200":
          description: Admin user list or examiner candidate directory
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/User" } }
    post:
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
  /imports:
    post:
      operationId: importData
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportInput" }
      responses:
        "200":
          description: Validated import preview or committed import
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
  /attempts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getAttempt
      responses:
        "200":
          description: Authorized attempt with server time
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attempt" }
  /attempts/{id}/answers:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: saveAnswers
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerBatch" }
      responses:
        "200":
          description: Confirmed server save
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveReceipt" }
  /attempts/{id}/submit:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: submitAttempt
      responses:
        "200":
          description: Idempotently finalized attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attempt" }
  /attempts/{id}/events:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: recordEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "201":
          description: Reviewable incident recorded, not proof of misconduct
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /attempts/{id}/violations:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: recordViolation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViolationInput" }
      responses:
        "200":
          description: Updated supervision state. Reaching the limit locks the attempt for examiner review; it never scores it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supervision" }
  /attempts/{id}/supervision:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: superviseAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupervisionInput" }
      responses:
        "200":
          description: Attempt after the examiner or administrator decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attempt" }
  /attempts/{id}/ai-grade:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: suggestAiGrades
      responses:
        "200":
          description: Attempt with advisory AI suggestions on ungraded written answers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attempt" }
  /attempts/{id}/incident-review:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 150 } }
    get:
      operationId: getIncidentDossier
      responses:
        "200":
          description: Owner or authorized examiner dossier, with evidence sources separated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentDossier" }
    put:
      operationId: submitIncidentStatement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentStatementInput" }
      responses:
        "200":
          description: Immutable statement recorded, or identical retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentCase" }
    post:
      operationId: reviewIncident
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentDecisionInput" }
      responses:
        "200":
          description: Immutable examiner disposition recorded, without changing answers or grades
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentCase" }
  /attempts/{id}/integrity:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getIntegrityRecord
      responses:
        "200":
          description: Authorized policy, disclosure and human authorship review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrityRecord" }
    put:
      operationId: saveDisclosure
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisclosureInput" }
      responses:
        "200":
          description: Disclosure saved without changing answers or marks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrityRecord" }
  /attempts/{id}/authorship:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: requestAuthorshipReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthorshipInput" }
      responses:
        "201":
          description: Question-linked explanation requested after submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorshipReview" }
  /authorship-reviews/{id}/response:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: respondToAuthorship
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthorshipResponseInput" }
      responses:
        "200":
          description: Immutable candidate explanation or identical retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorshipReview" }
  /authorship-reviews/{id}/decision:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: decideAuthorship
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthorshipDecisionInput" }
      responses:
        "200":
          description: Advisory human outcome without grade changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorshipReview" }
  /attempts/{id}/grade:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: gradeAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GradeInput" }
      responses:
        "200":
          description: Graded attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attempt" }
  /results:
    get:
      operationId: listResults
      responses:
        "200":
          description: Authorized results
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Result" } }
  /analytics:
    get:
      operationId: getAnalytics
      responses:
        "200":
          description: Actual submission analytics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Analytics" }
  /verify/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      operationId: verifyReport
      responses:
        "200":
          description: Minimal report verification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportVerification" }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    User:
      type: object
      required: [id, name, email, role, active]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, examiner, candidate] }
        active: { type: boolean }
        createdAt: { type: string }
    SessionInfo:
      type: object
      required: [user, demoEnabled]
      properties:
        user:
          anyOf:
            - { $ref: "#/components/schemas/User" }
            - { type: "null" }
        demoEnabled: { type: boolean }
    UserInput:
      type: object
      required: [name, email, password, role]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email }
        password: { type: string, minLength: 10, maxLength: 128 }
        role: { type: string, enum: [admin, examiner, candidate] }
    UserUpdate:
      type: object
      properties:
        role: { type: string, enum: [admin, examiner, candidate] }
        active: { type: boolean }
    QuestionOption:
      type: object
      required: [id, text]
      properties:
        id: { type: string }
        text: { type: string, minLength: 1, maxLength: 2000 }
    QuestionInput:
      type: object
      required: [text, type, category, difficulty, marks, options, correctAnswers]
      properties:
        text: { type: string, minLength: 5, maxLength: 10000 }
        type: { type: string, enum: [single, multiple, written] }
        category: { type: string, minLength: 1, maxLength: 100 }
        difficulty: { type: string, enum: [easy, medium, hard] }
        marks: { type: number, minimum: 1, maximum: 1000 }
        options: { type: array, items: { $ref: "#/components/schemas/QuestionOption" }, maxItems: 10 }
        correctAnswers: { type: array, items: { type: string }, maxItems: 10 }
        explanation: { type: string, maxLength: 5000 }
    Question:
      allOf:
        - { $ref: "#/components/schemas/QuestionInput" }
        - type: object
          required: [id]
          properties:
            id: { type: string }
            createdAt: { type: string }
    BlueprintQuota:
      type: object
      description: Disjoint exact-match stratum. Marks and count are exact, never relaxed.
      required: [topic, difficulty, type, marks, count]
      properties:
        topic: { type: string, minLength: 1, maxLength: 100 }
        difficulty: { type: string, enum: [easy, medium, hard] }
        type: { type: string, enum: [single, multiple, written] }
        marks: { type: number, minimum: 1, maximum: 1000 }
        count: { type: integer, minimum: 1, maximum: 200 }
    BlueprintInput:
      type: object
      required: [quotas]
      properties:
        quotas:
          type: array
          description: Empty disables subset selection. Total count must not exceed 200; duplicate strata are rejected.
          maxItems: 200
          items: { $ref: "#/components/schemas/BlueprintQuota" }
    BlueprintCheck:
      allOf:
        - { $ref: "#/components/schemas/BlueprintQuota" }
        - type: object
          required: [available, shortage, actualCount, actualMarks]
          properties:
            available: { type: integer }
            shortage: { type: integer }
            actualCount: { type: integer }
            actualMarks: { type: number }
    FormComparison:
      type: object
      required: [attemptId, candidateName, sandbox, status, questionIds, questionCount, totalMarks, matches, checks]
      properties:
        attemptId: { type: string }
        candidateName: { type: string }
        sandbox: { type: boolean }
        status: { type: string }
        questionIds: { type: array, items: { type: string } }
        questionCount: { type: integer }
        totalMarks: { type: number }
        matches: { type: boolean }
        checks: { type: array, items: { $ref: "#/components/schemas/BlueprintCheck" } }
    BlueprintItemMetric:
      type: object
      required: [id, text, samples, correct, accuracy]
      properties:
        id: { type: string }
        text: { type: string }
        samples: { type: integer }
        correct: { type: integer }
        accuracy: { type: number }
    BlueprintReport:
      type: object
      required: [quotas, valid, issues, checks, questionCount, totalMarks, poolCount, frozen, forms, items, caveat]
      properties:
        quotas: { type: array, items: { $ref: "#/components/schemas/BlueprintQuota" } }
        valid: { type: boolean }
        issues: { type: array, items: { type: string } }
        checks: { type: array, items: { $ref: "#/components/schemas/BlueprintCheck" } }
        questionCount: { type: integer }
        totalMarks: { type: number }
        poolCount: { type: integer }
        frozen: { type: boolean }
        forms: { type: array, items: { $ref: "#/components/schemas/FormComparison" } }
        items: { type: array, items: { $ref: "#/components/schemas/BlueprintItemMetric" } }
        caveat: { type: string }
    ExamInput:
      type: object
      required: [title, instructions, duration, startsAt, endsAt, questionIds]
      properties:
        title: { type: string, minLength: 3, maxLength: 160 }
        subject: { type: string, maxLength: 100 }
        instructions: { type: string, minLength: 5, maxLength: 10000 }
        duration: { type: integer, minimum: 1, maximum: 480 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        questionIds: { type: array, items: { type: string }, maxItems: 200 }
        randomize: { type: boolean, default: true }
        passPercent: { type: integer, minimum: 0, maximum: 100, default: 50 }
        assistancePolicy:
          anyOf:
            - { $ref: "#/components/schemas/AssistancePolicyInput" }
            - { type: "null" }
        deliverySettings: { $ref: "#/components/schemas/DeliverySettings" }
    DeliverySettings:
      type: object
      required: [requireProctorApproval, requireReadiness, confirmSubjects, lockOnSave, minimumAttemptPercent, venue, sessionLabel]
      properties:
        requireProctorApproval: { type: boolean }
        requireReadiness: { type: boolean }
        confirmSubjects: { type: boolean }
        lockOnSave: { type: boolean }
        minimumAttemptPercent: { type: integer, minimum: 0, maximum: 100 }
        venue: { type: string, maxLength: 200 }
        sessionLabel: { type: string, maxLength: 100 }
        requireFullscreen: { type: boolean, description: "Exits from fullscreen and tab switches count as violations" }
        maxViolations: { type: integer, minimum: 1, maximum: 10, description: "Violations before the attempt locks for examiner review" }
    EntryInformation:
      type: object
      required: [examId, examTitle, candidateId, candidateName, subjects, questionCount, totalMarks, duration, startsAt, endsAt, serverNow, entryVersion, settings]
      properties:
        examId: { type: string }
        examTitle: { type: string }
        candidateId: { type: string }
        candidateName: { type: string }
        subjects: { type: array, items: { type: string } }
        questionCount: { type: integer }
        totalMarks: { type: number }
        duration: { type: integer }
        startsAt: { type: string }
        endsAt: { type: string }
        serverNow: { type: string }
        entryVersion: { type: string }
        settings: { $ref: "#/components/schemas/DeliverySettings" }
    Admission:
      type: object
      required: [id, examId, examTitle, candidateId, candidateName, status, requestedAt, expiresAt, decidedAt, reviewerName, reason, serverNow]
      properties:
        id: { type: string }
        examId: { type: string }
        examTitle: { type: string }
        candidateId: { type: string }
        candidateName: { type: string }
        status: { type: string, enum: [pending, approved, denied, consumed, expired] }
        requestedAt: { type: string }
